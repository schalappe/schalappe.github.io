{{- $c := hugo.Data.profile.contact -}}
<footer class="site-footer">
  <p>© {{ now.Year }} {{ hugo.Data.profile.name }}</p>
  <p>
    <a href="mailto:{{ $c.email }}">{{ $c.email }}</a>
    <a href="{{ $c.github }}">GitHub</a>
    <a href="{{ $c.linkedin }}">LinkedIn</a>
    <a href="{{ $c.substack }}">Substack</a>
    <a href="{{ $c.photos }}">{{ i18n "photos" }}</a>
  </p>
</footer>
