baseURL = "https://info.schalappe.page/"
title = "Abdallah Hakim Kone"
defaultContentLanguage = "en"
enableRobotsTXT = true
# Writing lives on Substack: no local blog, tags, or feeds.
disableKinds = ["taxonomy", "term", "section", "rss"]

[params]
  images = ["og.jpg"]

[languages]
  [languages.en]
    locale = "en"
    label = "English"
    weight = 1
  [languages.fr]
    locale = "fr"
    label = "Français"
    weight = 2

[module.hugoVersion]
  min = "0.158.0"
