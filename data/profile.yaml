headline:
  en: I take machine learning models to production and keep them running.
  fr: Je mets les modèles de machine learning en production et je les maintiens en service.

about:
  en: >-
    I'm a machine learning engineer at BNP Paribas. Data scientists build the models; I build everything
    that takes them to production: deployment pipelines, serving, monitoring, and the infrastructure and
    network work around them. I have worked in system and network administration, software development
    and machine learning. That is why I am often the link between teams: infrastructure, data scientists,
    developers.
    Before BNP, I spent four and a half years at Softeam on production computer vision and tabular models
    for a public-sector client.
  fr: >-
    Je suis Machine Learning Engineer chez BNP Paribas. Les data scientists construisent les modèles ; je
    construis tout ce qui les mène en production : pipelines de déploiement, mise à disposition, monitoring,
    et le travail d'infrastructure et de réseau autour. J'ai travaillé en administration systèmes et
    réseaux, en développement logiciel et en machine learning. C'est pourquoi je suis souvent le lien entre
    les différentes équipes : infrastructure, data scientists, développeurs. Avant BNP, j'ai passé quatre ans et demi chez Softeam sur des
    modèles de vision par ordinateur et des modèles tabulaires en production, pour un acteur public.

interests:
  en: Outside work, I love history, art and heritage. I like to visit historic sites and look at what past civilizations left behind. I photograph these places. I also brew specialty coffee.
  fr: En dehors du travail, je suis passionné d'histoire, d'art et de patrimoine. J'aime découvrir les lieux chargés d'histoire et contempler les traces que les civilisations ont laissées derrière elles. Je photographie ces lieux. Je prépare aussi du café de spécialité.

experience:
  - company: BNP Paribas
    role: Machine Learning Engineer
    city: Nantes, France
    start: 2025-06
    end: null
    summary:
      en: I take a data science team's models to production. We host every model in-house for security reasons.
      fr: Je mets en production les modèles d'une équipe de data scientists, tous hébergés en interne pour des raisons de sécurité.
    highlights:
      en:
        - Package the team's models as APIs and batch jobs in Docker images, deployed on Domino Data Lab with GitLab CI/CD.
        - Serve open-weight LLMs (Llama, GPT-OSS, Gemma, Mistral Medium), Whisper and Voxtral for speech-to-text, and the data scientists' BERT models.
        - Build pipelines that transcribe conversations, then write a summary or check control points.
        - Build RAG systems with BGE-M3 that suggest replies to customer emails, first on ChromaDB, now on an embedding store I wrote.
        - Handle the network side of deployments and keep the model APIs reachable.
        - Set up model monitoring and alerting with Arize and Kibana.
      fr:
        - Packaging des modèles en API et en batchs dans des images Docker, déployées sur Domino Data Lab avec GitLab CI/CD.
        - Mise à disposition de LLM open-weight (Llama, GPT-OSS, Gemma, Mistral Medium), de Whisper, de Voxtral et des modèles BERT de l'équipe.
        - Pipelines de transcription de conversations qui produisent un compte rendu ou vérifient des points de contrôle.
        - RAG de suggestion de réponses aux e-mails clients avec BGE-M3, sur ChromaDB puis sur une base d'embeddings que j'ai développée.
        - Prise en charge du réseau dans les déploiements et de la disponibilité des API qui servent les modèles.
        - Monitoring et alertes sur les modèles avec Arize et Kibana.
    stack:
      [
        Python,
        Docker,
        GitLab CI/CD,
        Domino Data Lab,
        Transformers,
        ChromaDB,
        DVC,
        Arize,
        Kibana,
      ]

  - company: Softeam
    role:
      en: AI Engineer (consultant)
      fr: Ingénieur IA (consultant)
    city: Rennes, France
    start: 2021-01
    end: 2025-06
    summary:
      en: Consultant for a major public-sector client, automating the processing of traffic violations from radar images with computer vision and tabular models.
      fr: Consultant pour un acteur majeur du secteur public, sur l'automatisation du traitement des infractions routières à partir de clichés radar, avec des modèles de vision et des modèles tabulaires.
    highlights:
      en:
        - Rebuilt the vehicle identification model as a mixture of specialized experts, which reduced recognition errors.
        - Designed a Swin Transformer classifier that rejects unusable radar images before processing.
        - Developed heuristics that locate the violation zone in radar images.
        - Automated retraining, from data collection to model selection (Optuna, Aim, MLflow).
        - Improved the sampling of images sent for labeling, and added bootstrapped confidence intervals to the business metrics.
        - Integrated the models into the production processing chain with the teams that run it (requirements, acceptance tests).
        - Designed a secure training environment with architects and the CISO, and led GDPR compliance with legal experts.
        - Mentored three junior engineers.
      fr:
        - Refonte du modèle d'identification des véhicules en mixture of experts, qui a réduit les erreurs de reconnaissance.
        - Conception d'un classifieur Swin Transformer qui écarte les clichés radar inexploitables avant traitement.
        - Développement d'heuristiques de détection des zones d'infraction sur les clichés radar.
        - Automatisation du réentraînement, de la collecte des données à la sélection des modèles (Optuna, Aim, MLflow).
        - Amélioration de l'échantillonnage des images à labelliser, et intervalles de confiance par bootstrap sur les métriques métier.
        - Intégration des modèles en production avec les équipes de la chaîne de traitement (recueil des besoins, recettes).
        - Conception d'un environnement d'entraînement sécurisé avec les architectes et le RSSI ; pilotage RGPD avec des juristes.
        - Encadrement de trois ingénieurs juniors.
    stack:
      [
        Python,
        TensorFlow,
        XGBoost,
        SHAP,
        OpenCV,
        Optuna,
        MLflow,
        Aim,
        FastAPI,
        Docker,
        RabbitMQ,
