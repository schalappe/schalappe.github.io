# Builds the CV (Typst) and the site (Hugo); deploys to GitHub Pages from main.
# Pull requests run the build only, so template or CV errors fail before merge.
# A monthly scheduled build keeps date-driven content current between pushes: the career chart, the current role's
# duration, the chart axes and the footer year all come from the build date.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      TYPST_VERSION: 0.15.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -qO ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Build CV
        run: |
          mkdir -p static/cv
          for lang in en fr; do
            typst compile --root . --font-path cv/fonts --input lang=$lang cv/cv.typ static/cv/abdallah-hakim-kone-cv-$lang.pdf
          done

      # baseURL comes from hugo.toml (HTTPS custom domain); never override it from the Pages action.
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Paris
        run: hugo --gc --minify

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
